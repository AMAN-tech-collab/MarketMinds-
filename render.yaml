services:
  - type: web
    name: marketminds-node-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CLIENT_ORIGIN
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: openai
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYSIS_SERVICE_URL
        fromService:
          type: web
          name: marketminds-python-ai
          property: hostport

  - type: web
    name: marketminds-python-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: ALLOWED_ORIGINS
        sync: false
